<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orman Parkur Kahramanı</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <div class="title">Orman Parkur Kahramanı</div>
        <div id="hud" class="hud">Düşmanlar: 0 | Can: 3</div>
      </div>
      <canvas id="game" width="960" height="540" aria-label="2D parkur oyunu"></canvas>
      <div class="controls">
        <span>Sol / Sağ: A D / Oklar</span>
        <span>Zıplama: W / ↑ / Boşluk</span>
        <span>Ateş: F / J / K</span>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
